<section id="beneficios" class="benefits section">
  <div class="container">
    <app-section-title
      appReveal
      eyebrow="Orientação técnica"
      title="Por que buscar orientação técnica?"
      description="Compreender as exigências aplicáveis e organizar cada etapa do processo traz mais segurança para decidir os próximos passos."
      align="center"
    />

    <ul class="benefits__grid">
      @for (benefit of benefits; track benefit.title; let index = $index) {
        <li class="benefit-card" appReveal>
          <span class="benefit-card__number" aria-hidden="true">
            {{ (index + 1).toString().padStart(2, '0') }}
          </span>
          <span class="benefit-card__icon">
            <app-icon [name]="benefit.icon" />
          </span>
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
